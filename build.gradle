plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.utopia'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// spring boot
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// implementation 'org.springframework.security:spring-security-crypto:5.7.1'

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// mysql
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
	runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'

	// test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	// oauth2
	implementation 'org.springframework.security:spring-security-oauth2-client'
	// implementation platform('org.springframework.boot:spring-boot-dependencies:3.3.5')
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// Spring WebFlux
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// QueryDsl
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	implementation 'io.netty:netty-resolver-dns-native-macos:4.1.86.Final:osx-aarch_64' // Apple Silicon (M1/M2)

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Spring Boot Cache
	implementation 'org.springframework.boot:spring-boot-starter-cache'

	// JSON 직렬화용
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// CSV 파싱용
	implementation 'org.apache.commons:commons-csv:1.10.0'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Spotless 설정
spotless {
	java {
		googleJavaFormat()           // 구글 자바 포맷 스타일 적용
		removeUnusedImports()        // 사용하지 않는 import 제거
		importOrder('java', 'javax', 'org.springframework', '', 'com.kkinikong')  // import 순서
		trimTrailingWhitespace()     // 줄 끝 공백 제거
		endWithNewline()             // 파일 끝에 빈 줄 추가
		indentWithSpaces(4)          // 공백 4칸 들여쓰기
	}
}

// Git Hook 자동 복사 Task
tasks.register('updateGitHooks', Copy){
	from new File(rootProject.rootDir, 'scripts/pre-commit')
	into new File(rootProject.rootDir, '.git/hooks')
	fileMode = 0775  // Gradle8 부터 fileMode는 deprecated (추후 문제가 생기면 리팩토링 진행 예정)
}

tasks.named('compileJava'){
	dependsOn 'spotlessApply'
	dependsOn 'updateGitHooks'
}

bootJar {
	archiveFileName = "kkinikong.jar"
}