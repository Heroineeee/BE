services:
  db: # MySQL 서비스
    image: mysql:8.0
    restart: always
    container_name: kkini-kong-mysql
    ports:
      - "33306:3306"
    environment: # 환경 변수 설정
      MYSQL_DATABASE: kkinikong
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASS}  # MYSQL 패스워드 설정
      TZ: Asia/Seoul
    command: # 명령어 실행
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
        - kkini-kong-net

  elasticsearch: # Elasticsearch 서비스
    image: elasticsearch:8.18.1
    container_name: kkini-kong-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - xpack.graph.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
        - kkini-kong-net

volumes:
  mysql_data:

networks:
    kkini-kong-net:
