version: '3.8'

services:
  db: # MySQL 서비스
    image: mysql:8.0
    restart: always
    container_name: utopia-mysql-container
    ports:
      - "33306:3306"
    environment: # 환경 변수 설정
      MYSQL_DATABASE: utopia
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASS}  # MYSQL 패스워드 설정
      TZ: Asia/Seoul
    command: # 명령어 실행
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
        - utopia-net

volumes:
  mysql_data:

networks:
    utopia-net:
