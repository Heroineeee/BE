spring:
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
  data:
    redis:
      host: ${LOCAL_REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: OFF

Swagger:
  server:
    url: ${LOCAL_SWAGGER_URL}

opensearch:
  index: ${LOCAL_OPEN_SEARCH_INDEX}