spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

Swagger:
    server:
        url: ${SWAGGER_URL}

opensearch:
    index: ${OPEN_SEARCH_INDEX}

management:
  endpoints:
    web:
      exposure:
        include: "*"