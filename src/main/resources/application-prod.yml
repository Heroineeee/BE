spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    show-sql: false
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        highlight_sql: false
        use_sql_comments: false

Swagger:
    server:
        url: ${SWAGGER_URL}

opensearch:
    index: ${OPEN_SEARCH_INDEX}

management:
  endpoints:
    web:
      exposure:
        include: "*"